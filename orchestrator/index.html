<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px;height:calc(100vh - var(--topbar-h));overflow-y:auto">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden">
    <div style="padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg-2);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)">Context Injection</div>
    <div style="padding:14px" id="context-panel"></div>
  </div>
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden">
    <div style="padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg-2);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)">Model Routing</div>
    <div style="padding:14px">
      <div class="input-group mb-3"><label class="input-label">Intent</label><input class="input" id="routing-intent" placeholder="Describe your intent…"></div>
      <button class="btn btn-primary btn-sm" onclick="inferRouting()">Infer Routing</button>
      <div id="routing-result" style="margin-top:10px;font-size:12.5px;color:var(--text-secondary)"></div>
    </div>
  </div>
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;grid-column:1/-1">
    <div style="padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg-2);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)">Audit Log</div>
    <div style="padding:14px;max-height:300px;overflow-y:auto" id="audit-log"><div style="font-size:12px;color:var(--text-faint)">No audit entries yet. Run the orchestrator to generate entries.</div></div>
  </div>
</div>
  </div>
</div>
<script src="/shared/aurelia.js"></script>
<script>
function init(){
  var ctx=document.getElementById("context-panel");
  var tok=localStorage.getItem("aurelia_device_token")||"—";
  var model=localStorage.getItem("aurelia_model")||"groq/openai/gpt-oss-20b";
  var ws=localStorage.getItem("aurelia_active_workspace")||"None";
  ctx.innerHTML=["User: SJ — Identity Partners","Device Token: "+tok.slice(0,20)+"…","Active Model: "+model,"Workspace: "+ws,"Time: "+new Date().toLocaleString("en-GB"),"LCT: "+window.__AURELIA_LCT__].map(function(line){return "<div style='padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--ink)'>"+line+"</div>";}).join("");
}
function inferRouting(){
  var intent=document.getElementById("routing-intent").value.toLowerCase();
  var result="";
  if(/research|find|search|paper/.test(intent))result="Research path → Research Agent → Tavily+Brave+Exa";
  else if(/reason|analys|complex|why/.test(intent))result="Reasoning path → DeepSeek V4 Flash (1M ctx, thinking mode)";
  else if(/write|draft|create|content/.test(intent))result="Creative path → Mistral Large 3 (MoE 675B/41B active)";
  else if(/crm|contact|client/.test(intent))result="CRM path → CRM Agent → Gemma 4 31B";
  else result="Chat path → GPT-OSS 20B (Groq) → Gemma 4 31B (Cerebras)";
  document.getElementById("routing-result").textContent=result;
  addAudit("routing","Intent traced: "+document.getElementById("routing-intent").value.slice(0,40),"→ "+result);
}
function addAudit(type,action,detail){
  var log=document.getElementById("audit-log");
  var entry=document.createElement("div");
  entry.style.cssText="padding:7px 0;border-bottom:1px solid var(--border);font-size:12px";
  entry.innerHTML="<div style='font-size:10.5px;color:var(--text-faint)'>"+new Date().toLocaleTimeString("en-GB")+" · "+type+"</div><div style='color:var(--ink);margin-top:2px'>"+action+"</div><div style='color:var(--text-muted);font-size:11.5px'>"+detail+"</div>";
  log.insertBefore(entry,log.firstChild);
}
async function runOrchestrator(){
  Toast.show("Orchestrator running…","info");
  inferRouting();
  addAudit("orchestrator","Full run triggered","Context injected, routing inferred");
  Toast.show("Orchestrator run complete","success");
}
document.addEventListener("DOMContentLoaded",init);
</script>
</body>
