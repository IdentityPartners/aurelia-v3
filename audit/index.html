<div style="padding:18px;max-width:900px">
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px" id="audit-stats"></div>
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden">
    <div style="padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg-2);display:flex;gap:6px;flex-wrap:wrap">
      <select class="input" id="level-filter" onchange="renderLog()" style="max-width:130px;font-size:12px"><option value="">All levels</option><option value="error">Error</option><option value="warning">Warning</option><option value="info">Info</option><option value="success">Success</option></select>
      <select class="input" id="module-filter" onchange="renderLog()" style="max-width:150px;font-size:12px"><option value="">All modules</option><option value="chat">Chat</option><option value="research">Research</option><option value="agent">Agent</option><option value="routing">Routing</option></select>
    </div>
    <div style="max-height:500px;overflow-y:auto" id="audit-list"><div style="padding:20px;font-size:12.5px;color:var(--text-faint);text-align:center">No audit entries yet.</div></div>

<script src="/shared/aurelia.js"></script>
<script>
var auditLog=[];
function init(){auditLog=JSON.parse(localStorage.getItem("aurelia_audit_log")||"[]");renderStats();renderLog();}
function renderStats(){var el=document.getElementById("audit-stats");var total=auditLog.length;var errors=auditLog.filter(function(e){return e.type==="error";}).length;var warnings=auditLog.filter(function(e){return e.type==="warning";}).length;var info=auditLog.filter(function(e){return e.type==="info";}).length;var success=auditLog.filter(function(e){return e.type==="success";}).length;el.innerHTML=[["Total",total,""],["Errors",errors,"tag-red"],["Warnings",warnings,"tag-amber"],["Info",info,"tag-blue"],["Success",success,"tag-green"]].map(function(s){return "<div style='background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center'><div style='font-family:var(--font-serif);font-size:22px;color:var(--ink)'>"+s[1]+"</div><div style='font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:2px'>"+s[0]+"</div></div>";}).join("");}
function renderLog(){var level=document.getElementById("level-filter").value;var module=document.getElementById("module-filter").value;var filtered=auditLog.filter(function(e){return(!level||e.type===level)&&(!module||e.module===module);});var el=document.getElementById("audit-list");if(!filtered.length){el.innerHTML="<div style='padding:20px;font-size:12.5px;color:var(--text-faint);text-align:center'>No entries match filters.</div>";return;}var colors={error:"tag-red",warning:"tag-amber",info:"tag-blue",success:"tag-green"};el.innerHTML=filtered.slice(0,100).map(function(e){return "<div style='padding:10px 14px;border-bottom:1px solid var(--border)'><div style='display:flex;align-items:center;gap:7px;margin-bottom:3px'><span class='tag "+(colors[e.type]||"tag-ink")+"'>"+e.type+"</span><span style='font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono)'>"+new Date(e.ts).toLocaleString("en-GB")+"</span></div><div style='font-size:13px;color:var(--ink)'>"+e.action+"</div>"+(e.detail?"<div style='font-size:11.5px;color:var(--text-muted);margin-top:2px'>"+e.detail+"</div>":"")+"</div>";}).join("");}
function clearLog(){if(!confirm("Clear audit log?"))return;auditLog=[];localStorage.removeItem("aurelia_audit_log");renderStats();renderLog();}
function exportLog(){var text=auditLog.map(function(e){return "["+new Date(e.ts).toISOString()+"] ["+e.type+"] "+e.action+(e.detail?"\n  "+e.detail:"");}).join("\n\n");var blob=new Blob([text],{type:"text/plain"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="aurelia-audit-"+Date.now()+".txt";a.click();}
document.addEventListener("DOMContentLoaded",init);
</script>
