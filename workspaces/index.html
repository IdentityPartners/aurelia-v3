<div style="padding:20px;max-width:1000px">
  <h1 style="font-family:var(--font-serif);font-size:22px;font-weight:400;color:var(--ink);margin-bottom:4px">Workspaces</h1>
  <p style="font-size:12.5px;color:var(--text-faint);margin-bottom:16px">Visual folders — organise and filter content. Never gate navigation.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px" id="workspaces-grid"></div>
</div>
<div class="modal-overlay" id="new-ws-modal">
  <div class="modal"><div class="modal-header"><span class="modal-title">New Workspace</span><button class="modal-close" onclick="closeModal()">✕</button></div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="input-group"><label class="input-label">Name</label><input class="input" id="ws-name" placeholder="e.g. Identity Partners"></div>
    <div class="input-group"><label class="input-label">Tags</label><input class="input" id="ws-tags" placeholder="#IP #business"></div>
    <div class="input-group"><label class="input-label">Colour</label><input type="color" id="ws-color" value="#0f3b3a" style="width:48px;height:36px;border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:2px"></div>
    <div style="display:flex;gap:8px"><button class="btn btn-primary" onclick="saveWorkspace()">Create</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>
  </div></div>
</div>
  </div>
</div>
<script src="/shared/aurelia.js"></script>
<script>
function init(){renderWorkspaces();}
function renderWorkspaces(){
  var workspaces=JSON.parse(localStorage.getItem("aurelia_workspaces")||"[]");
  if(!workspaces.length){workspaces=[{id:"ip",name:"Identity Partners",tags:["#IP","#business"],color:"#0f3b3a",ts:Date.now()},{id:"personal",name:"Personal",tags:["#personal"],color:"#5c2d3f",ts:Date.now()},{id:"research",name:"Research",tags:["#research"],color:"#1a5554",ts:Date.now()}];localStorage.setItem("aurelia_workspaces",JSON.stringify(workspaces));}
  var grid=document.getElementById("workspaces-grid");
  var chats=JSON.parse(localStorage.getItem("aurelia_chats")||"[]");
  var drafts=JSON.parse(localStorage.getItem("aurelia_drafts")||"[]");
  grid.innerHTML=workspaces.map(function(w){return "<div style='background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;position:relative;overflow:hidden'><div style='position:absolute;top:0;left:0;right:0;height:3px;background:"+w.color+"'></div><div style='display:flex;align-items:center;gap:10px;margin-bottom:10px'><div style='width:36px;height:36px;border-radius:50%;background:"+w.color+";display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:15px;color:#fff'>"+w.name[0]+"</div><div><div style='font-size:14px;font-weight:600;color:var(--ink)'>"+w.name+"</div><div style='font-size:11px;color:var(--text-faint)'>"+(w.tags||[]).join(" ")+"</div></div></div><div style='display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px'><div style='background:var(--bg-2);border-radius:6px;padding:8px;text-align:center'><div style='font-size:18px;font-weight:600;color:var(--ink)'>"+chats.filter(function(c){return c.workspace===w.id;}).length+"</div><div style='font-size:10px;color:var(--text-faint)'>Chats</div></div><div style='background:var(--bg-2);border-radius:6px;padding:8px;text-align:center'><div style='font-size:18px;font-weight:600;color:var(--ink)'>"+drafts.filter(function(d){return d.workspace===w.id;}).length+"</div><div style='font-size:10px;color:var(--text-faint)'>Drafts</div></div></div><div style='display:flex;gap:6px'><button class='btn btn-primary btn-sm' onclick='applyLens(""+w.id+"")'>Apply Lens</button><button class='btn btn-ghost btn-sm' onclick='deleteWorkspace(""+w.id+"")'>Delete</button></div></div>";}).join("")+"<div style='background:var(--surface);border:2px dashed var(--border);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;min-height:180px;cursor:pointer' onclick='showNewWorkspace()'><div style='text-align:center;color:var(--text-faint)'><div style='font-size:28px;margin-bottom:6px'>+</div><div style='font-size:13px'>New Workspace</div></div></div>";}
function showNewWorkspace(){document.getElementById("new-ws-modal").classList.add("open");}
function closeModal(){document.getElementById("new-ws-modal").classList.remove("open");}
function saveWorkspace(){var name=document.getElementById("ws-name").value.trim();if(!name){Toast.show("Name required","error");return;}var workspaces=JSON.parse(localStorage.getItem("aurelia_workspaces")||"[]");workspaces.push({id:"ws_"+Date.now(),name,tags:document.getElementById("ws-tags").value.trim().split(/\s+/).filter(Boolean),color:document.getElementById("ws-color").value,ts:Date.now()});localStorage.setItem("aurelia_workspaces",JSON.stringify(workspaces));renderWorkspaces();closeModal();Toast.show("Workspace created","success");}
function deleteWorkspace(id){var workspaces=JSON.parse(localStorage.getItem("aurelia_workspaces")||"[]").filter(function(w){return w.id!==id;});localStorage.setItem("aurelia_workspaces",JSON.stringify(workspaces));renderWorkspaces();}
function applyLens(id){localStorage.setItem("aurelia_active_workspace",id);Toast.show("Workspace lens applied","success");}
document.addEventListener("DOMContentLoaded",init);
</script>
</body>
