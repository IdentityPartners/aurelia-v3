  <div class="main-content" id="main-content">
    <div class="topbar"><span class="topbar-title">Research Library</span><div class="topbar-actions"><button class="btn btn-ghost btn-sm" onclick="exportResults()">Export</button><button class="btn btn-primary btn-sm" onclick="saveRun()">Save Run</button></div></div>
<div style="display:flex;height:calc(100vh - var(--topbar-h));overflow:hidden">
<div style="width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:10px;overflow-y:auto">
  <div style="font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px">Saved Runs</div>
  <div id="saved-runs"></div>
  <div style="font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin:14px 0 8px">Sources</div>
  <div id="source-filter"></div>
</div>
<div style="flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)">
  <div style="padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface)">
    <div style="display:flex;gap:8px;margin-bottom:10px"><input class="input" id="research-query" placeholder="Search across 150+ sources…" style="flex:1"><button class="btn btn-primary" onclick="runResearch()">Search</button></div>
    <div style="display:flex;gap:5px;flex-wrap:wrap" id="source-chips">
      <span class="chip on" data-s="tavily" onclick="toggleSrc(this)">⚡ Tavily</span>
      <span class="chip on" data-s="brave" onclick="toggleSrc(this)">⚡ Brave</span>
      <span class="chip on" data-s="exa" onclick="toggleSrc(this)">⚡ Exa</span>
      <span class="chip" data-s="semantic_scholar" onclick="toggleSrc(this)">📚 Scholar</span>
      <span class="chip" data-s="ncbi" onclick="toggleSrc(this)">🧬 NCBI</span>
    </div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:14px" id="results-list">
    <div class="empty-state"><div class="empty-state-icon" style="font-size:28px;opacity:.2">◎</div><div class="empty-state-title">Research Library</div><div class="empty-state-desc">Search across 150+ academic, data, health, law, and humanities sources.</div></div>
  </div>
</div>
</div>
  </div>
</div>
<script src="/shared/aurelia.js"></script>
<script>
const ALL_SOURCES = [
  {name:'Google Scholar',cat:'Scholarly',url:'https://scholar.google.com/scholar?q=',desc:'Broad academic search'},
  {name:'CORE',cat:'Scholarly',url:'https://core.ac.uk/search?q=',desc:'Open access research'},
  {name:'OpenAlex',cat:'Scholarly',url:'https://openalex.org/works?search=',desc:'Open scholarly graph'},
  {name:'arXiv',cat:'Preprints',url:'https://arxiv.org/search/?searchtype=all&query=',desc:'Physics, maths, CS'},
  {name:'bioRxiv',cat:'Preprints',url:'https://www.biorxiv.org/search/',desc:'Biology preprints'},
  {name:'medRxiv',cat:'Preprints',url:'https://www.medrxiv.org/search/',desc:'Medical preprints'},
  {name:'SSRN',cat:'Preprints',url:'https://papers.ssrn.com/sol3/results.cfm?txtkey=',desc:'Social science preprints'},
  {name:'PubMed',cat:'Health',url:'https://pubmed.ncbi.nlm.nih.gov/?term=',desc:'Biomedical literature'},
  {name:'Europe PMC',cat:'Health',url:'https://europepmc.org/search?query=',desc:'European biomedical literature'},
  {name:'ClinicalTrials.gov',cat:'Health',url:'https://clinicaltrials.gov/search?term=',desc:'Clinical trial registry'},
  {name:'Zenodo',cat:'Data',url:'https://zenodo.org/search?q=',desc:'CERN open data'},
  {name:'Figshare',cat:'Data',url:'https://figshare.com/search?q=',desc:'Research data & figures'},
  {name:'Harvard Dataverse',cat:'Data',url:'https://dataverse.harvard.edu/dataverse/harvard?q=',desc:'Harvard research data'},
  {name:'Kaggle',cat:'Data',url:'https://www.kaggle.com/search?q=',desc:'ML & data science datasets'},
  {name:'World Bank Data',cat:'UN/Intl',url:'https://data.worldbank.org/indicator?q=',desc:'Development indicators'},
  {name:'OECD Data',cat:'UN/Intl',url:'https://data-explorer.oecd.org/',desc:'OECD statistics'},
  {name:'Eurostat',cat:'UN/Intl',url:'https://ec.europa.eu/eurostat/databrowser/',desc:'European statistics'},
  {name:'WHO GHO',cat:'UN/Intl',url:'https://www.who.int/data/gho',desc:'Global health observatory'},
  {name:'data.gov.uk',cat:'UK Data',url:'https://www.data.gov.uk/search?q=',desc:'UK government open data'},
  {name:'ONS',cat:'UK Data',url:'https://www.ons.gov.uk/search?q=',desc:'Office for National Statistics'},
  {name:'UK Data Service',cat:'UK Data',url:'https://ukdataservice.ac.uk/find-data/browse/?q=',desc:'UK social science data'},
  {name:'BAILII',cat:'Law',url:'https://www.bailii.org/',desc:'British & Irish legal information'},
  {name:'EUR-Lex',cat:'Law',url:'https://eur-lex.europa.eu/search.html?text=',desc:'EU law & legislation'},
  {name:'Google Patents',cat:'Patents',url:'https://patents.google.com/?q=',desc:'Global patent search'},
  {name:'Lens.org',cat:'Patents',url:'https://lens.org/lens/search/scholar?q=',desc:'Open patent & scholarly search'},
  {name:'Internet Archive',cat:'Humanities',url:'https://archive.org/search?query=',desc:'Digital library & archive'},
  {name:'Europeana',cat:'Humanities',url:'https://www.europeana.eu/en/search?query=',desc:'European cultural heritage'},
  {name:'Library of Congress',cat:'Humanities',url:'https://www.loc.gov/search/?q=',desc:'US national library'},
  {name:'Copernicus CDS',cat:'Environment',url:'https://cds.climate.copernicus.eu/datasets',desc:'EU climate data store'},
  {name:'NASA EarthData',cat:'Environment',url:'https://earthdata.nasa.gov/search?q=',desc:'NASA earth observation'},
  {name:'GBIF',cat:'Environment',url:'https://www.gbif.org/occurrence/search?q=',desc:'Biodiversity data'},
  {name:'IDEAS/RePEc',cat:'Economics',url:'https://ideas.repec.org/search.html?q=',desc:'Economics research papers'},
  {name:'NBER',cat:'Economics',url:'https://www.nber.org/search?q=',desc:'National Bureau of Economic Research'},
  {name:'FRED',cat:'Economics',url:'https://fred.stlouisfed.org/search?st=',desc:'Federal Reserve economic data'},
  {name:'ICPSR',cat:'Social Sci',url:'https://www.icpsr.umich.edu/web/pages/ICPSR/index.html',desc:'Social science data archive'},
  {name:'Pew Research',cat:'Social Sci',url:'https://www.pewresearch.org/search/?q=',desc:'US & global surveys'},
  {name:'EThOS',cat:'Theses',url:'https://ethos.bl.uk/SearchResults.do?query=',desc:'UK theses (British Library)'},
  {name:'OATD',cat:'Theses',url:'https://oatd.org/oatd/search?q=',desc:'Open access theses'},
  {name:'OSF',cat:'Preprints',url:'https://osf.io/search/?q=',desc:'Open Science Framework'},
  {name:'PsyArXiv',cat:'Preprints',url:'https://psyarxiv.com/discover?q=',desc:'Psychology preprints'},
];
var srcs=new Set(["tavily","brave","exa"]),savedRuns=[],allResults=[];
function selectAllSources() {
    document.querySelectorAll('[data-s]').forEach(el => {
      const s = el.dataset.s;
      if (!srcs.has(s)) { srcs.add(s); el.classList.add('on'); }
    });
    Toast && Toast.show('All sources selected', 'success');
  }
  function toggleSrc(el) {var s=el.dataset.s;if(srcs.has(s)){srcs.delete(s);el.classList.remove("on");}else{srcs.add(s);el.classList.add("on");}}
async async function runResearch(){
  var q=document.getElementById("research-query").value.trim();
  if(!q)return;
  var list=document.getElementById("results-list");
  var tok=localStorage.getItem("aurelia_device_token")||"dt_research";
  
  // Show loading state using createElement (no innerHTML with mixed quotes)
  list.innerHTML="";
  var loading=document.createElement("div");
  loading.style.cssText="text-align:center;color:var(--text-faint);padding:24px;font-size:13px";
  loading.textContent="Searching across "+srcs.size+" sources…";
  list.appendChild(loading);
  
  try{
    var res=await fetch("https://aurelia-api.identitypartners.workers.dev/api/research",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok,"Origin":"https://aurelia.identitypartners.uk"},
      body:JSON.stringify({query:q,sources:[...srcs]})
    });
    var data=await res.json();
    allResults=data.results||[];
    list.innerHTML="";
    if(!allResults.length){
      var noRes=document.createElement("div");
      noRes.style.cssText="text-align:center;color:var(--text-faint);padding:24px;font-size:13px";
      noRes.textContent="No results found. Try different search terms or enable more sources.";
      list.appendChild(noRes);
      return;
    }
    allResults.forEach(function(r){
      var card=document.createElement("div");
      card.className="result-card fade-in";
      card.style.cursor="pointer";
      
      var title=document.createElement("div");
      title.className="result-title";
      title.textContent=r.title||"Untitled";
      
      var url=document.createElement("div");
      url.className="result-url";
      url.textContent=r.url||"";
      
      var snip=document.createElement("div");
      snip.className="result-snippet";
      snip.textContent=(r.snippet||r.content||"").slice(0,220)+"…";
      
      var footer=document.createElement("div");
      footer.className="result-footer";
      footer.style.cssText="display:flex;align-items:center;gap:7px;margin-top:10px;flex-wrap:wrap";
      
      var srcTag=document.createElement("span");
      srcTag.className="tag";
      srcTag.textContent=r.source||"web";
      footer.appendChild(srcTag);
      
      if(r.score){
        var scoreTag=document.createElement("span");
        scoreTag.className="tag tag-sage";
        scoreTag.textContent=r.score;
        footer.appendChild(scoreTag);
      }
      
      var actions=document.createElement("span");
      actions.style.cssText="margin-left:auto;display:flex;gap:5px";
      
      var chatBtn=document.createElement("button");
      chatBtn.className="btn btn-ghost btn-sm";
      chatBtn.textContent="→ Chat";
      chatBtn.onclick=function(e){e.stopPropagation();sendToChat(r.title,r.snippet||"");};
      
      var draftBtn=document.createElement("button");
      draftBtn.className="btn btn-ghost btn-sm";
      draftBtn.textContent="→ Draft";
      draftBtn.onclick=function(e){e.stopPropagation();sendToDraft(r.title,r.snippet||"");};
      
      var openBtn=document.createElement("a");
      openBtn.className="btn btn-ghost btn-sm";
      openBtn.textContent="↗";
      openBtn.href=r.url||"#";
      openBtn.target="_blank";
      openBtn.onclick=function(e){e.stopPropagation();};
      
      actions.appendChild(chatBtn);
      actions.appendChild(draftBtn);
      actions.appendChild(openBtn);
      footer.appendChild(actions);
      
      card.appendChild(title);
      card.appendChild(url);
      card.appendChild(snip);
      card.appendChild(footer);
      card.onclick=function(){showDetail(r);};
      list.appendChild(card);
    });
  }catch(e){
    list.innerHTML="";
    var errDiv=document.createElement("div");
    errDiv.style.cssText="text-align:center;color:var(--text-faint);padding:24px;font-size:13px";
    errDiv.textContent="Search failed: "+e.message+". Check API keys in Settings.";
    list.appendChild(errDiv);
  }
}
function saveRun(){var q=document.getElementById("research-query").value.trim();if(!q||!allResults.length){Toast.show("Run a search first","info");return;}savedRuns.push({id:"run_"+Date.now(),query:q,results:allResults,ts:Date.now()});localStorage.setItem("aurelia_research",JSON.stringify(savedRuns));Toast.show("Run saved","success");}
function exportResults(){if(!allResults.length){Toast.show("No results","info");return;}var text=allResults.map(function(r){return "# "+r.title+"\n"+r.url+"\n\n"+(r.snippet||"")+"\n\n---\n";}).join("\n");var blob=new Blob([text],{type:"text/markdown"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="research-"+Date.now()+".md";a.click();}
document.getElementById("research-query").addEventListener("keydown",function(e){if(e.key==="Enter")runResearch();});
savedRuns=JSON.parse(localStorage.getItem("aurelia_research")||"[]");
</script>
<script src="/shared/help.js"></script>
</body>
</html>
