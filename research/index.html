  <div class="main-content" id="main-content">
    <div class="topbar"><span class="topbar-title">Research Library</span><div class="topbar-actions"><button class="btn btn-ghost btn-sm" onclick="exportResults()">Export</button><button class="btn btn-primary btn-sm" onclick="saveRun()">Save Run</button></div></div>
<div style="display:flex;height:calc(100vh - var(--topbar-h));overflow:hidden">
<div style="width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:10px;overflow-y:auto">
  <div style="font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px">Saved Runs</div>
  <div id="saved-runs"></div>
  <div style="font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin:14px 0 8px">Sources</div>
  <div id="source-filter"></div>
</div>
<div style="flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)">
  <div style="padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface)">
    <div style="display:flex;gap:8px;margin-bottom:10px"><input class="input" id="research-query" placeholder="Search across 150+ sources…" style="flex:1"><button class="btn btn-primary" onclick="runResearch()">Search</button></div>
    <div style="display:flex;gap:5px;flex-wrap:wrap" id="source-chips">
      <span class="chip on" data-s="tavily" onclick="toggleSrc(this)">⚡ Tavily</span>
      <span class="chip on" data-s="brave" onclick="toggleSrc(this)">⚡ Brave</span>
      <span class="chip on" data-s="exa" onclick="toggleSrc(this)">⚡ Exa</span>
      <span class="chip" data-s="semantic_scholar" onclick="toggleSrc(this)">📚 Scholar</span>
      <span class="chip" data-s="ncbi" onclick="toggleSrc(this)">🧬 NCBI</span>
    </div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:14px" id="results-list">
    <div class="empty-state"><div class="empty-state-icon" style="font-size:28px;opacity:.2">◎</div><div class="empty-state-title">Research Library</div><div class="empty-state-desc">Search across 150+ academic, data, health, law, and humanities sources.</div></div>
  </div>
</div>
</div>
  </div>
</div>
<script src="/shared/aurelia.js"></script>
<script>
var srcs=new Set(["tavily","brave","exa"]),savedRuns=[],allResults=[];
function toggleSrc(el){var s=el.dataset.s;if(srcs.has(s)){srcs.delete(s);el.classList.remove("on");}else{srcs.add(s);el.classList.add("on");}}
async function runResearch(){
  var q=document.getElementById("research-query").value.trim();if(!q)return;
  var list=document.getElementById("results-list");
  list.innerHTML="<div style='text-align:center;color:var(--text-faint);padding:24px'>Searching…</div>";
  var tok=localStorage.getItem("aurelia_device_token")||"dt_research";
  try{
    var res=await fetch("https://aurelia-api.identitypartners.workers.dev/api/research",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok,"Origin":"https://aurelia.identitypartners.uk"},body:JSON.stringify({query:q,sources:[...srcs]})});
    var data=await res.json();
    allResults=data.results||[];
    if(!allResults.length){list.innerHTML="<div style='text-align:center;color:var(--text-faint);padding:24px'>No results found.</div>";return;}
    list.innerHTML=allResults.map(function(r){return "<div style='background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:9px;cursor:pointer' onclick='window.open(""+r.url+"","_blank")'><div style='font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:3px'>"+r.title+"</div><div style='font-size:11px;color:var(--accent);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'>"+r.url+"</div><div style='font-size:12.5px;color:var(--text-muted)'>"+((r.snippet||r.content||"").slice(0,180))+"…</div></div>";}).join("");
  }catch(e){list.innerHTML="<div style='text-align:center;color:var(--text-faint);padding:24px'>Search failed: "+e.message+"</div>";}
}
function saveRun(){var q=document.getElementById("research-query").value.trim();if(!q||!allResults.length){Toast.show("Run a search first","info");return;}savedRuns.push({id:"run_"+Date.now(),query:q,results:allResults,ts:Date.now()});localStorage.setItem("aurelia_research",JSON.stringify(savedRuns));Toast.show("Run saved","success");}
function exportResults(){if(!allResults.length){Toast.show("No results","info");return;}var text=allResults.map(function(r){return "# "+r.title+"\n"+r.url+"\n\n"+(r.snippet||"")+"\n\n---\n";}).join("\n");var blob=new Blob([text],{type:"text/markdown"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="research-"+Date.now()+".md";a.click();}
document.getElementById("research-query").addEventListener("keydown",function(e){if(e.key==="Enter")runResearch();});
savedRuns=JSON.parse(localStorage.getItem("aurelia_research")||"[]");
</script>
<script src="/shared/help.js"></script>
</body>
</html>
