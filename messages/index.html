<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Aurelia — Messages</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%231c1917'/><text y='23' x='7' font-size='17' font-family='Georgia,serif' fill='%23f7f3e9'>A</text></svg>">
  <link rel="stylesheet" href="/shared/aurelia.css">
  <style>
    .msg-shell{display:flex;height:calc(100vh - var(--topbar-h,56px));overflow:hidden}
    .msg-list-pane{width:280px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
    .msg-list-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .msg-list{flex:1;overflow-y:auto}
    .msg-thread-item{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;display:flex;gap:10px;align-items:flex-start}
    .msg-thread-item:hover{background:var(--bg-2,#f0e9e0)}
    .msg-thread-item.active{background:var(--bg-2,#f0e9e0)}
    .msg-thread-av{width:36px;height:36px;border-radius:50%;background:var(--accent,#0f3b3a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
    .msg-thread-info{flex:1;min-width:0}
    .msg-thread-name{font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .msg-thread-preview{font-size:11.5px;color:var(--muted,#78716c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
    .msg-thread-time{font-size:10px;color:var(--faint,#a8a29e);flex-shrink:0}
    .msg-thread-unread{width:8px;height:8px;border-radius:50%;background:var(--accent,#0f3b3a);flex-shrink:0;margin-top:4px}
    .msg-main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg,#f7f3e9)}
    .msg-header{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:10px;flex-shrink:0}
    .msg-header-av{width:36px;height:36px;border-radius:50%;background:var(--accent,#0f3b3a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0}
    .msg-header-info{flex:1}
    .msg-header-name{font-size:14px;font-weight:600;color:var(--ink)}
    .msg-header-status{font-size:11px;color:var(--faint,#a8a29e)}
    .msg-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
    .msg-bubble-wrap{display:flex;gap:8px;max-width:80%}
    .msg-bubble-wrap.me{align-self:flex-end;flex-direction:row-reverse}
    .msg-bubble-av{width:28px;height:28px;border-radius:50%;background:var(--accent,#0f3b3a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;margin-top:2px}
    .msg-bubble-wrap.me .msg-bubble-av{background:var(--bg-3,#e8ddd4);color:var(--ink)}
    .msg-bubble-body{display:flex;flex-direction:column;gap:3px}
    .msg-bubble{background:var(--surface);border:1px solid var(--border);border-radius:12px;border-bottom-left-radius:3px;padding:10px 13px;font-size:13.5px;line-height:1.6;color:var(--ink)}
    .msg-bubble-wrap.me .msg-bubble{background:var(--accent,#0f3b3a);color:#fff;border-color:var(--accent,#0f3b3a);border-bottom-left-radius:12px;border-bottom-right-radius:3px}
    .msg-bubble-meta{font-size:10px;color:var(--faint,#a8a29e)}
    .msg-bubble-wrap.me .msg-bubble-meta{text-align:right}
    .msg-attachment{background:var(--bg-2,#f0e9e0);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-top:4px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--ink)}
    .msg-attachment:hover{background:var(--bg-3,#e8ddd4)}
    .msg-input-area{padding:12px 14px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
    .msg-input-wrap{background:var(--bg-2,#f0e9e0);border:1.5px solid var(--border);border-radius:20px;padding:8px 12px;transition:border-color .15s}
    .msg-input-wrap:focus-within{border-color:var(--accent,#0f3b3a)}
    .msg-input-wrap textarea{width:100%;background:none;border:none;outline:none;font-family:var(--font,Inter);font-size:14px;color:var(--ink);resize:none;max-height:120px;line-height:1.5}
    .msg-input-wrap textarea::placeholder{color:var(--faint,#a8a29e)}
    .msg-input-actions{display:flex;align-items:center;gap:6px;margin-top:7px}
    .msg-send-btn{background:var(--accent,#0f3b3a);color:#fff;border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:auto;flex-shrink:0}
    .msg-send-btn:active{transform:scale(.9)}
    .attach-chip{background:var(--bg-3,#e8ddd4);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11.5px;color:var(--ink);display:flex;align-items:center;gap:5px}
    .attach-chip-remove{cursor:pointer;color:var(--faint,#a8a29e);font-size:14px}
    .new-msg-modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
    .new-msg-modal.open{display:flex}
    .new-msg-box{background:var(--surface);border-radius:16px;padding:24px;max-width:480px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.15)}
  </style>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="logo-mark">A</div><span class="logo-text">Aurelia</span></div>
    <div class="sidebar-nav">
      <a href="/index.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="nav-label">Home</span></a>
      <a href="/chat/index.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span class="nav-label">Chat</span></a>
      <a href="/messages/index.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><span class="nav-label">Messages</span></a>
      <a href="/crm/index.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span class="nav-label">CRM</span></a>
      <a href="/comms/index.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.63A2 2 0 012 .18h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.72 6.72l1.29-1.29a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg><span class="nav-label">Comms Centre</span></a>
      <div class="nav-section-label">System</div>
      <a href="/settings/index.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/></svg><span class="nav-label">Settings</span></a>
    </div>
    <div class="sidebar-footer"><button class="sidebar-collapse-btn" onclick="Sidebar.toggle()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg><span>Collapse</span></button></div>
  </nav>

  <div class="main-content" id="main-content">
    <div class="topbar">
      <span class="topbar-title">Messages</span>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="showNewMessage()">+ New Message</button>
      </div>
    </div>

    <div class="msg-shell">
      <!-- Thread list -->
      <div class="msg-list-pane">
        <div class="msg-list-header">
          <span style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint,#a8a29e)">Conversations</span>
          <button class="btn btn-primary btn-sm" onclick="showNewMessage()">+</button>
        </div>
        <div class="msg-list" id="thread-list"></div>
      </div>

      <!-- Message area -->
      <div class="msg-main" id="msg-main">
        <div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--faint,#a8a29e)">
          <div style="font-size:32px;opacity:.2">✉</div>
          <div style="font-size:14px">Select a conversation or start a new one</div>
          <button class="btn btn-primary btn-sm" onclick="showNewMessage()">+ New Message</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- New message modal -->
<div class="new-msg-modal" id="new-msg-modal" onclick="if(event.target===this)closeNewMessage()">
  <div class="new-msg-box">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-family:var(--font-serif,Georgia);font-size:18px;font-weight:500;color:var(--ink)">New Message</div>
      <button onclick="closeNewMessage()" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--faint,#a8a29e)">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="input-group">
        <label class="input-label">To (name or CRM contact)</label>
        <input class="input" id="new-msg-to" placeholder="Name, email, or select from CRM...">
        <div id="crm-suggestions" style="display:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-top:4px;max-height:150px;overflow-y:auto"></div>
      </div>
      <div class="input-group">
        <label class="input-label">Subject</label>
        <input class="input" id="new-msg-subject" placeholder="Subject...">
      </div>
      <div class="input-group">
        <label class="input-label">Message</label>
        <textarea class="input" id="new-msg-body" rows="5" placeholder="Write your message..."></textarea>
      </div>
      <div class="input-group">
        <label class="input-label">Attach (optional)</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap" id="new-msg-attachments"></div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="btn btn-ghost btn-sm" onclick="attachCRMRecord()">📋 CRM Record</button>
          <button class="btn btn-ghost btn-sm" onclick="attachDraft()">✦ Draft</button>
          <label class="btn btn-ghost btn-sm" style="cursor:pointer">📎 File<input type="file" style="display:none" onchange="attachFile(this)"></label>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn btn-primary" onclick="sendNewMessage()">Send Message</button>
        <button class="btn btn-ghost" onclick="saveAsDraft()">Save Draft</button>
        <button class="btn btn-ghost" onclick="closeNewMessage()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script src="/shared/aurelia.js"></script>
<script src="/shared/help.js"></script>
<script>
var threads = [];
var currentThread = null;
var pendingAttachments = [];
var currentUser = 'SJ';

function init() {
  threads = JSON.parse(localStorage.getItem('aurelia_messages') || '[]');
  if (!threads.length) {
    // Create sample threads
    threads = [
      {
        id: 'thread_system',
        participants: ['SJ', 'Aurelia System'],
        subject: 'Welcome to Messages',
        messages: [{
          id: 'msg_1', from: 'Aurelia System', to: 'SJ',
          body: 'Welcome to Aurelia Messages. You can send internal messages, attach CRM records, drafts, and files. Use this for notes to yourself, client follow-ups, or team communications.',
          ts: Date.now() - 3600000, read: true, attachments: []
        }],
        ts: Date.now() - 3600000, unread: 0
      }
    ];
    saveThreads();
  }
  renderThreadList();
  
  // CRM contact suggestions
  var toInput = document.getElementById('new-msg-to');
  if (toInput) {
    toInput.addEventListener('input', function() { showCRMSuggestions(toInput.value); });
  }
}

function renderThreadList() {
  var list = document.getElementById('thread-list');
  list.innerHTML = '';
  if (!threads.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--faint,#a8a29e);font-size:13px">No messages yet</div>';
    return;
  }
  [...threads].sort(function(a,b) { return b.ts - a.ts; }).forEach(function(t) {
    var lastMsg = t.messages[t.messages.length - 1];
    var item = document.createElement('div');
    item.className = 'msg-thread-item' + (currentThread && currentThread.id === t.id ? ' active' : '');
    item.onclick = function() { openThread(t.id); };
    
    var av = document.createElement('div');
    av.className = 'msg-thread-av';
    var other = t.participants.find(function(p) { return p !== currentUser; }) || t.participants[0];
    av.textContent = other.slice(0,2).toUpperCase();
    
    var info = document.createElement('div');
    info.className = 'msg-thread-info';
    var name = document.createElement('div');
    name.className = 'msg-thread-name';
    name.textContent = t.subject || other;
    var preview = document.createElement('div');
    preview.className = 'msg-thread-preview';
    preview.textContent = lastMsg ? lastMsg.body.slice(0,50) : '';
    info.appendChild(name);
    info.appendChild(preview);
    
    var time = document.createElement('div');
    time.className = 'msg-thread-time';
    time.textContent = ago(t.ts);
    
    item.appendChild(av);
    item.appendChild(info);
    item.appendChild(time);
    if (t.unread > 0) {
      var dot = document.createElement('div');
      dot.className = 'msg-thread-unread';
      item.appendChild(dot);
    }
    list.appendChild(item);
  });
}

function openThread(id) {
  currentThread = threads.find(function(t) { return t.id === id; });
  if (!currentThread) return;
  currentThread.unread = 0;
  saveThreads();
  renderThreadList();
  renderMessageArea();
}

function renderMessageArea() {
  var main = document.getElementById('msg-main');
  main.innerHTML = '';
  main.style.display = 'flex';
  main.style.flexDirection = 'column';
  
  // Header
  var header = document.createElement('div');
  header.className = 'msg-header';
  var other = currentThread.participants.find(function(p) { return p !== currentUser; }) || currentThread.participants[0];
  var av = document.createElement('div');
  av.className = 'msg-header-av';
  av.textContent = other.slice(0,2).toUpperCase();
  var info = document.createElement('div');
  info.className = 'msg-header-info';
  var name = document.createElement('div');
  name.className = 'msg-header-name';
  name.textContent = currentThread.subject || other;
  var status = document.createElement('div');
  status.className = 'msg-header-status';
  status.textContent = currentThread.participants.join(', ');
  info.appendChild(name);
  info.appendChild(status);
  header.appendChild(av);
  header.appendChild(info);
  
  // Actions
  var actions = document.createElement('div');
  actions.style.cssText = 'display:flex;gap:6px';
  var replyBtn = document.createElement('button');
  replyBtn.className = 'btn btn-ghost btn-sm';
  replyBtn.textContent = 'Reply';
  replyBtn.onclick = function() { document.getElementById('msg-reply-input').focus(); };
  var deleteBtn = document.createElement('button');
  deleteBtn.className = 'btn btn-ghost btn-sm';
  deleteBtn.textContent = 'Delete';
  deleteBtn.onclick = function() { deleteThread(currentThread.id); };
  actions.appendChild(replyBtn);
  actions.appendChild(deleteBtn);
  header.appendChild(actions);
  main.appendChild(header);
  
  // Messages
  var msgs = document.createElement('div');
  msgs.className = 'msg-messages';
  msgs.id = 'msg-messages-area';
  currentThread.messages.forEach(function(m) { renderBubble(msgs, m); });
  main.appendChild(msgs);
  
  // Input
  var inputArea = document.createElement('div');
  inputArea.className = 'msg-input-area';
  
  var attachedDiv = document.createElement('div');
  attachedDiv.id = 'reply-attachments';
  attachedDiv.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px';
  
  var wrap = document.createElement('div');
  wrap.className = 'msg-input-wrap';
  var ta = document.createElement('textarea');
  ta.id = 'msg-reply-input';
  ta.rows = 2;
  ta.placeholder = 'Reply...';
  ta.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); }
  });
  wrap.appendChild(ta);
  
  var actionsRow = document.createElement('div');
  actionsRow.className = 'msg-input-actions';
  
  var attachCRM = document.createElement('button');
  attachCRM.className = 'btn btn-ghost btn-sm';
  attachCRM.textContent = '📋 CRM';
  attachCRM.onclick = attachCRMToReply;
  
  var attachDraftBtn = document.createElement('button');
  attachDraftBtn.className = 'btn btn-ghost btn-sm';
  attachDraftBtn.textContent = '✦ Draft';
  attachDraftBtn.onclick = attachDraftToReply;
  
  var fileLabel = document.createElement('label');
  fileLabel.className = 'btn btn-ghost btn-sm';
  fileLabel.style.cursor = 'pointer';
  fileLabel.textContent = '📎';
  var fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.style.display = 'none';
  fileInput.onchange = function() { attachFileToReply(fileInput); };
  fileLabel.appendChild(fileInput);
  
  var sendBtn = document.createElement('button');
  sendBtn.className = 'msg-send-btn';
  sendBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
  sendBtn.onclick = sendReply;
  
  actionsRow.appendChild(attachCRM);
  actionsRow.appendChild(attachDraftBtn);
  actionsRow.appendChild(fileLabel);
  actionsRow.appendChild(sendBtn);
  wrap.appendChild(actionsRow);
  
  inputArea.appendChild(attachedDiv);
  inputArea.appendChild(wrap);
  main.appendChild(inputArea);
  
  msgs.scrollTop = msgs.scrollHeight;
}

function renderBubble(container, m) {
  var isMe = m.from === currentUser;
  var wrap = document.createElement('div');
  wrap.className = 'msg-bubble-wrap' + (isMe ? ' me' : '');
  
  var av = document.createElement('div');
  av.className = 'msg-bubble-av';
  av.textContent = m.from.slice(0,2).toUpperCase();
  
  var body = document.createElement('div');
  body.className = 'msg-bubble-body';
  
  var bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = m.body;
  
  var meta = document.createElement('div');
  meta.className = 'msg-bubble-meta';
  meta.textContent = m.from + ' \u00b7 ' + ago(m.ts);
  
  body.appendChild(bubble);
  
  // Attachments
  if (m.attachments && m.attachments.length) {
    m.attachments.forEach(function(att) {
      var attEl = document.createElement('div');
      attEl.className = 'msg-attachment';
      attEl.textContent = (att.type === 'crm' ? '📋 ' : att.type === 'draft' ? '✦ ' : '📎 ') + att.name;
      if (att.url) attEl.onclick = function() { window.open(att.url, '_blank'); };
      body.appendChild(attEl);
    });
  }
  
  body.appendChild(meta);
  wrap.appendChild(av);
  wrap.appendChild(body);
  container.appendChild(wrap);
}

function sendReply() {
  var ta = document.getElementById('msg-reply-input');
  var text = ta ? ta.value.trim() : '';
  if (!text && !pendingAttachments.length) return;
  if (!currentThread) return;
  
  var msg = {
    id: 'msg_' + Date.now(),
    from: currentUser,
    to: currentThread.participants.find(function(p) { return p !== currentUser; }) || '',
    body: text,
    ts: Date.now(),
    read: true,
    attachments: [...pendingAttachments]
  };
  
  currentThread.messages.push(msg);
  currentThread.ts = Date.now();
  pendingAttachments = [];
  
  var attachedDiv = document.getElementById('reply-attachments');
  if (attachedDiv) attachedDiv.innerHTML = '';
  
  if (ta) ta.value = '';
  saveThreads();
  
  var area = document.getElementById('msg-messages-area');
  if (area) { renderBubble(area, msg); area.scrollTop = area.scrollHeight; }
}

function attachCRMToReply() {
  var contacts = JSON.parse(localStorage.getItem('aurelia_contacts') || '[]');
  if (!contacts.length) { if (typeof Toast !== 'undefined') Toast.show('No CRM contacts found', 'info'); return; }
  var contact = contacts[0]; // In a real implementation, show a picker
  addPendingAttachment({type:'crm', name: contact.first + ' ' + contact.last + ' (CRM)', id: contact.id});
}

function attachDraftToReply() {
  var drafts = JSON.parse(localStorage.getItem('aurelia_drafts') || '[]');
  if (!drafts.length) { if (typeof Toast !== 'undefined') Toast.show('No drafts found', 'info'); return; }
  var draft = drafts[drafts.length - 1];
  addPendingAttachment({type:'draft', name: draft.title || 'Untitled Draft', id: draft.id});
}

function attachFileToReply(input) {
  var file = input.files[0];
  if (!file) return;
  addPendingAttachment({type:'file', name: file.name, size: file.size});
}

function addPendingAttachment(att) {
  pendingAttachments.push(att);
  var div = document.getElementById('reply-attachments');
  if (!div) return;
  var chip = document.createElement('div');
  chip.className = 'attach-chip';
  chip.textContent = att.name;
  var remove = document.createElement('span');
  remove.className = 'attach-chip-remove';
  remove.textContent = '✕';
  remove.onclick = function() { pendingAttachments = pendingAttachments.filter(function(a) { return a !== att; }); chip.remove(); };
  chip.appendChild(remove);
  div.appendChild(chip);
}

function deleteThread(id) {
  if (!confirm('Delete this conversation?')) return;
  threads = threads.filter(function(t) { return t.id !== id; });
  currentThread = null;
  saveThreads();
  renderThreadList();
  document.getElementById('msg-main').innerHTML = '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--faint,#a8a29e);font-size:14px">Select a conversation</div>';
}

// New message
function showNewMessage() { document.getElementById('new-msg-modal').classList.add('open'); }
function closeNewMessage() { document.getElementById('new-msg-modal').classList.remove('open'); pendingAttachments = []; }

function showCRMSuggestions(q) {
  var contacts = JSON.parse(localStorage.getItem('aurelia_contacts') || '[]');
  var suggestions = document.getElementById('crm-suggestions');
  if (!q || !contacts.length) { suggestions.style.display = 'none'; return; }
  var filtered = contacts.filter(function(c) { return (c.first + ' ' + c.last).toLowerCase().includes(q.toLowerCase()); }).slice(0,5);
  if (!filtered.length) { suggestions.style.display = 'none'; return; }
  suggestions.style.display = 'block';
  suggestions.innerHTML = '';
  filtered.forEach(function(c) {
    var item = document.createElement('div');
    item.style.cssText = 'padding:8px 12px;cursor:pointer;font-size:13px;color:var(--ink);border-bottom:1px solid var(--border)';
    item.textContent = c.first + ' ' + c.last + (c.email ? ' — ' + c.email : '');
    item.onclick = function() {
      document.getElementById('new-msg-to').value = c.first + ' ' + c.last;
      suggestions.style.display = 'none';
    };
    suggestions.appendChild(item);
  });
}

function attachCRMRecord() {
  var contacts = JSON.parse(localStorage.getItem('aurelia_contacts') || '[]');
  if (!contacts.length) { if (typeof Toast !== 'undefined') Toast.show('No CRM contacts', 'info'); return; }
  var contact = contacts[0];
  addNewMsgAttachment({type:'crm', name: contact.first + ' ' + contact.last + ' (CRM)', id: contact.id});
}

function attachDraft() {
  var drafts = JSON.parse(localStorage.getItem('aurelia_drafts') || '[]');
  if (!drafts.length) { if (typeof Toast !== 'undefined') Toast.show('No drafts', 'info'); return; }
  var draft = drafts[drafts.length - 1];
  addNewMsgAttachment({type:'draft', name: draft.title || 'Untitled Draft', id: draft.id});
}

function attachFile(input) {
  var file = input.files[0];
  if (!file) return;
  addNewMsgAttachment({type:'file', name: file.name});
}

function addNewMsgAttachment(att) {
  pendingAttachments.push(att);
  var div = document.getElementById('new-msg-attachments');
  if (!div) return;
  var chip = document.createElement('div');
  chip.className = 'attach-chip';
  chip.textContent = att.name;
  var remove = document.createElement('span');
  remove.className = 'attach-chip-remove';
  remove.textContent = '✕';
  remove.onclick = function() { pendingAttachments = pendingAttachments.filter(function(a) { return a !== att; }); chip.remove(); };
  chip.appendChild(remove);
  div.appendChild(chip);
}

function sendNewMessage() {
  var to = document.getElementById('new-msg-to').value.trim();
  var subject = document.getElementById('new-msg-subject').value.trim();
  var body = document.getElementById('new-msg-body').value.trim();
  if (!to || !body) { if (typeof Toast !== 'undefined') Toast.show('To and message are required', 'error'); return; }
  
  var thread = {
    id: 'thread_' + Date.now(),
    participants: [currentUser, to],
    subject: subject || 'Message to ' + to,
    messages: [{
      id: 'msg_' + Date.now(),
      from: currentUser, to: to,
      body: body, ts: Date.now(), read: true,
      attachments: [...pendingAttachments]
    }],
    ts: Date.now(), unread: 0
  };
  
  threads.unshift(thread);
  pendingAttachments = [];
  saveThreads();
  renderThreadList();
  closeNewMessage();
  openThread(thread.id);
  if (typeof Toast !== 'undefined') Toast.show('Message sent', 'success');
}

function saveAsDraft() {
  var to = document.getElementById('new-msg-to').value.trim();
  var subject = document.getElementById('new-msg-subject').value.trim();
  var body = document.getElementById('new-msg-body').value.trim();
  var thread = {
    id: 'thread_draft_' + Date.now(),
    participants: [currentUser, to || 'Draft'],
    subject: '[Draft] ' + (subject || 'Untitled'),
    messages: [{id:'msg_draft_'+Date.now(), from:currentUser, to:to, body:body, ts:Date.now(), read:true, attachments:[...pendingAttachments], draft:true}],
    ts: Date.now(), unread: 0, draft: true
  };
  threads.unshift(thread);
  pendingAttachments = [];
  saveThreads();
  renderThreadList();
  closeNewMessage();
  if (typeof Toast !== 'undefined') Toast.show('Saved as draft', 'success');
}

function saveThreads() { localStorage.setItem('aurelia_messages', JSON.stringify(threads)); }
function ago(ts) { if(!ts) return ''; var d=Date.now()-ts; if(d<60000) return 'now'; if(d<3600000) return Math.floor(d/60000)+'m'; if(d<86400000) return Math.floor(d/3600000)+'h'; return Math.floor(d/86400000)+'d'; }

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
